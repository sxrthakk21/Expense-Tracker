<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Expense Tracker</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <!-- Login CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='login.css') }}"
    >
</head>


<body>

    <!-- =====================================================
         LOGIN CONTAINER
    ====================================================== -->

    <div class="login-container">


        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <div class="form-boxlogin">

            <form
                action="{{ url_for('login') }}"
                method="POST"
            >

                <!-- Heading -->
                <h1>Login</h1>


                <!-- =================================================
                     ERROR MESSAGE
                     This appears when username/password is incorrect
                ================================================== -->

                {% if error %}

                <div class="error-message">

                    <i class="fa-solid fa-circle-exclamation"></i>

                    <span>
                        {{ error }}
                    </span>

                </div>

                {% endif %}


                <!-- =================================================
                     USERNAME
                ================================================== -->

                <div class="input-box">

                    <input
                        type="text"
                        name="username"
                        placeholder="Username"
                        autocomplete="username"
                        required
                    >

                    <i class="fa-solid fa-user"></i>

                </div>


                <!-- =================================================
                     PASSWORD
                ================================================== -->

                <div class="input-box">

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                    <i
                        class="fa-solid fa-lock"
                        id="password-icon"
                    ></i>

                </div>


                <!-- =================================================
                     FORGOT PASSWORD
                ================================================== -->

                <div class="forgot-link">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- =================================================
                     LOGIN BUTTON
                ================================================== -->

                <button
                    type="submit"
                    class="btn"
                >
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login
                </button>


                <!-- =================================================
                     SOCIAL LOGIN TEXT
                ================================================== -->

                <p class="social-text">
                    or login with social platforms
                </p>


                <!-- =================================================
                     SOCIAL ICONS
                ================================================== -->

                <div class="social-icon">

                    <a href="#" title="Login with Google">
                        <i class="fa-brands fa-google"></i>
                    </a>

                    <a href="#" title="Login with Facebook">
                        <i class="fa-brands fa-facebook"></i>
                    </a>

                    <a href="#" title="Login with GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>

                    <a href="#" title="Login with LinkedIn">
                        <i class="fa-brands fa-linkedin"></i>
                    </a>

                </div>

            </form>

        </div>


        <!-- =====================================================
             RIGHT SIDE / WELCOME PANEL
        ====================================================== -->

        <div class="toggle-box">

            <div class="toggle-panel toggle-left">


                <!-- Wallet Icon -->

                <div class="welcome-icon">

                    <i class="fa-solid fa-wallet"></i>

                </div>


                <!-- Welcome Heading -->

                <h1>
                    Hello, Welcome!
                </h1>


                <!-- Welcome Text -->

                <p>
                    Enter your login credentials
                    to manage your expenses
                    easily and efficiently.
                </p>


                <!-- Small Feature -->

                <div class="welcome-feature">

                    <i class="fa-solid fa-chart-pie"></i>

                    <span>
                        Track your income & expenses
                    </span>

                </div>


                <div class="welcome-feature">

                    <i class="fa-solid fa-wallet"></i>

                    <span>
                        Manage your financial records
                    </span>

                </div>


                <div class="welcome-feature">

                    <i class="fa-solid fa-chart-line"></i>

                    <span>
                        View your financial insights
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         PASSWORD SHOW / HIDE
    ====================================================== -->

    <script>

        const passwordInput =
            document.getElementById("password");

        const passwordIcon =
            document.getElementById("password-icon");


        passwordIcon.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                passwordIcon.classList.remove(
                    "fa-lock"
                );

                passwordIcon.classList.add(
                    "fa-lock-open"
                );

            } else {

                passwordInput.type = "password";

                passwordIcon.classList.remove(
                    "fa-lock-open"
                );

                passwordIcon.classList.add(
                    "fa-lock"
                );

            }

        });

    </script>


</body>

</html>
